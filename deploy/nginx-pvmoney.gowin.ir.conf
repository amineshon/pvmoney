# pvmoney.gowin.ir
#
# روی سرور:
#   sudo cp deploy/nginx-pvmoney.gowin.ir.conf /etc/nginx/sites-available/pvmoney.gowin.ir
#   sudo ln -sf /etc/nginx/sites-available/pvmoney.gowin.ir /etc/nginx/sites-enabled/pvmoney.gowin.ir
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pvmoney.gowin.ir
#
# پورت‌های داکر (فقط localhost):
#   frontend  127.0.0.1:3011 -> 3000
#   backend   127.0.0.1:8083 -> 8080

server {
    listen 80;
    listen [::]:80;
    server_name pvmoney.gowin.ir;

    client_max_body_size 8m;

    location /health {
        proxy_pass http://127.0.0.1:8083/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8083/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
